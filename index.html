<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="弹射怪兽 · 原生 Canvas 2D + Matter.js 弹弓物理射击小游戏，100 关 / 6 款皮肤技能 / 5 套场景主题">
<title>弹射怪兽 · 弹弓物理射击</title>
<link rel="stylesheet" href="style.css">
<!-- 物理引擎：优先用仓库内置版本（离线可玩），本地文件缺失时自动回退 CDN -->
<script src="vendor/matter.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js';s.onerror=function(){var t=document.createElement('script');t.src='https://unpkg.com/matter-js@0.19.0/build/matter.min.js';document.head.appendChild(t);};document.head.appendChild(s);"></script>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="1280" height="720"></canvas>

    <div id="hud" class="hidden">
      <span class="chip" id="chipLv">关卡 1</span>
      <span class="chip" id="chipBirds">🎯 弹药 3</span>
      <span class="chip" id="chipTarget">🐷 目标 1</span>
      <span class="chip" id="chipBomb" style="display:none">💣 0</span>
      <span class="chip" id="chipSkill" style="display:none">⌨️ 空格</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnMenu">菜单</button>
      <button class="btn" id="btnRetry">重玩</button>
    </div>
    <div id="tip" class="hidden">拖住小怪兽往后拉，松手发射！</div>

    <div id="menu" class="overlay">
      <h1>弹射怪兽</h1>
      <div class="sub">拖拽弹弓 · 调整角度与力度 · 击倒结构，消灭所有目标</div>
      <div id="continueRow" style="display:none; margin-bottom:18px;">
        <button class="btn big" id="btnContinue">继续游戏</button>
      </div>
      <div id="skinRow">
        <span class="skinLabel">怪兽皮肤</span>
        <div id="skins"></div>
      </div>
      <div id="skinDesc"></div>
      <div id="levels"></div>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <div class="card">
        <h2 id="endTitle">通关！</h2>
        <div id="stars">★★★</div>
        <div id="endMsg"></div>
        <div class="row">
          <button class="btn ghost" id="btnEndMenu">选关</button>
          <button class="btn" id="btnNext">下一关</button>
          <button class="btn" id="btnEndRetry">再玩一次</button>
        </div>
      </div>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
